name: Проверки и выпуск
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.15'
          - os: windows-2025
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Я устанавливаю закреплённые зависимости
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
      - name: Я проверяю контракт, Dagster и CLI
        run: |
          python -m unittest discover -s tests -v
          python scripts/smoke.py
          python scripts/zip_smoke.py
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Decl1s/dagster-delivery-assets'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Я выпускаю проверенные исходники и контрольную сумму
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
